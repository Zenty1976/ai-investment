openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Investment API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market-monitor
    description: Market Monitor analysis
  - name: event-monitor
    description: Event Monitor — upcoming financial-market events in the next 14 days
  - name: news-monitor
    description: News Monitor — AI-curated market-moving news from the last 24-72 hours
  - name: repository
    description: Analysis Repository — shared read interface for all module results
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market-monitor/analyze:
    post:
      operationId: runMarketAnalysis
      tags: [market-monitor]
      summary: Run market analysis
      description: Calls the AI service to analyze current market conditions and returns structured JSON
      responses:
        "200":
          description: Market analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAnalysis"
        "500":
          description: Analysis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /event-monitor/analyze:
    post:
      operationId: runEventAnalysis
      tags: [event-monitor]
      summary: Run event monitor analysis
      description: Searches for upcoming financial-market events in the next 14 days and returns structured JSON
      responses:
        "200":
          description: Event monitor analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMonitorAnalysis"
        "500":
          description: Analysis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No event data available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /news-monitor/analyze:
    post:
      operationId: runNewsAnalysis
      tags: [news-monitor]
      summary: Run news monitor analysis
      description: Searches for the most important market-moving news from the last 24-72 hours and returns a curated structured JSON result
      responses:
        "200":
          description: News monitor analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsAnalysis"
        "500":
          description: Analysis failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /repository:
    get:
      operationId: listRepositoryEntries
      tags: [repository]
      summary: List all stored module results
      description: Returns every module's latest analysis result, ordered by most recently updated
      responses:
        "200":
          description: All stored entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositoryEntry"
  /repository/{module}:
    get:
      operationId: getRepositoryEntry
      tags: [repository]
      summary: Get a specific module's latest result
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
          description: Module identifier, e.g. "market-monitor"
      responses:
        "200":
          description: The module's latest stored entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryEntry"
        "404":
          description: No result stored for this module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketAnalysisSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        published:
          type: string
      required:
        - title
        - url
    MarketAnalysis:
      type: object
      properties:
        summary:
          type: string
        marketSentiment:
          type: string
          enum: [Positive, Neutral, Negative]
        riskLevel:
          type: string
          enum: [Low, Moderate, High]
        positiveFactors:
          type: array
          items:
            type: string
        negativeFactors:
          type: array
          items:
            type: string
        strongSectors:
          type: array
          items:
            type: string
        weakSectors:
          type: array
          items:
            type: string
        keyRisks:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MarketAnalysisSource"
        timestamp:
          type: string
        analysisDuration:
          type: number
          description: Time taken to complete the analysis in milliseconds
      required:
        - summary
        - marketSentiment
        - riskLevel
        - positiveFactors
        - negativeFactors
        - strongSectors
        - weakSectors
        - keyRisks
        - sources
        - timestamp
        - analysisDuration
    EventMonitorSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        published:
          type: string
          description: YYYY-MM-DD or empty string
      required:
        - title
        - url
    UpcomingEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        category:
          type: string
        importance:
          type: string
          enum: [High, Medium, Low]
        affectedMarkets:
          type: array
          items:
            type: string
        expectedImpact:
          type: string
        reason:
          type: string
      required:
        - title
        - date
        - category
        - importance
        - affectedMarkets
        - expectedImpact
        - reason
    NextMajorEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          description: YYYY-MM-DD
        countdownDays:
          type: number
          description: Days until the event — always calculated by the server
      required:
        - title
        - date
        - countdownDays
    EventMonitorAnalysis:
      type: object
      properties:
        summary:
          type: string
        nextMajorEvent:
          $ref: "#/components/schemas/NextMajorEvent"
        events:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingEvent"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/EventMonitorSource"
        timestamp:
          type: string
        analysisDuration:
          type: number
          description: Time taken to complete the analysis in milliseconds
      required:
        - summary
        - nextMajorEvent
        - events
        - sources
        - timestamp
        - analysisDuration
    NewsTopStory:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        importance:
          type: string
          enum: [High, Medium, Low]
      required:
        - title
        - summary
        - importance
    NewsItem:
      type: object
      properties:
        id:
          type: string
          description: Stable kebab-case identifier, e.g. "fed-rate-cut-2026-07-31"
        title:
          type: string
        summary:
          type: string
        category:
          type: string
        importance:
          type: string
          enum: [High, Medium, Low]
        affectedMarkets:
          type: array
          items:
            type: string
        whyItMatters:
          type: string
        marketImpact:
          type: string
          description: Short sentence describing the market impact, e.g. "Positive for AI stocks" or "Negative for government bonds"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
        publishedAt:
          type: string
          description: ISO 8601 date or datetime
      required:
        - id
        - title
        - summary
        - category
        - importance
        - affectedMarkets
        - whyItMatters
        - marketImpact
        - confidence
        - source
        - publishedAt
    NewsAnalysis:
      type: object
      properties:
        executiveSummary:
          type: string
        overallMarketImpact:
          type: string
        topStory:
          $ref: "#/components/schemas/NewsTopStory"
        news:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        timestamp:
          type: string
        analysisDuration:
          type: number
          description: Time taken to complete the analysis in milliseconds
      required:
        - executiveSummary
        - overallMarketImpact
        - topStory
        - news
        - timestamp
        - analysisDuration
    RepositoryEntry:
      type: object
      description: A module's latest stored analysis result with metadata
      properties:
        moduleName:
          type: string
          description: Stable identifier for the module, e.g. "market-monitor"
        result:
          type: object
          description: The structured analysis result produced by the module
          additionalProperties: true
        createdAt:
          type: string
          description: ISO 8601 — when this module first saved a result
        updatedAt:
          type: string
          description: ISO 8601 — when this module last saved a result
      required:
        - moduleName
        - result
        - createdAt
        - updatedAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
